<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑल-इन-वन स्मार्ट स्टूडियो</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --surface: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --accent: #8b5cf6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }
        header {
            text-align: center; padding: 2.5rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin: 0; font-size: 2.5rem; background: linear-gradient(90deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tool-nav {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 2rem; flex-wrap: wrap;
        }
        .nav-btn {
            background: var(--surface); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); padding: 0.8rem 1.5rem; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--accent); border-color: var(--accent);
            transform: translateY(-2px); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        #workspace {
            background: var(--surface); border-radius: 16px;
            padding: 2rem; min-height: 400px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart स्टूडियो</h1>
        <p>आपकी अपनी एडवांस टूलकिट</p>
    </header>

    <main>
        <nav class="tool-nav">
            <button class="nav-btn active" onclick="loadTool('resizer')">इमेज रिसाइज़र</button>
            <button class="nav-btn" onclick="loadTool('pdf-maker')">PDF मेकर</button>
            <button class="nav-btn" onclick="loadTool('converter')">कनवर्टर</button>
        </nav>

        <section id="workspace">
            <h2>स्वागत है!</h2>
            <p>ऊपर दिए गए बटनों में से कोई एक टूल चुनें। टूल का इस्तेमाल यहीं लोड हो जाएगा。</p>
        </section>
    </main>

    <script src="main.js"></script>
    <script>
        async function loadTool(toolName) {
            const workspace = document.getElementById('workspace');
            workspace.innerHTML = '<p>लोड हो रहा है...</p>';

            try {
                const module = await import(`./modules/${toolName}.js?cachebust=${Date.now()}`);
                module.init(workspace);
            } catch (err) {
                console.error("टूल लोड करने में विफल:", err);
                workspace.innerHTML = '<h2 style="color: #ef4444;">त्रुटि</h2><p>माफ़ कीजिए, यह टूल अभी उपलब्ध नहीं है। कृपया मॉड्यूल की जाँच करें。</p>';
            }
        }
    </script>
</body>
</html>
