<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart India Hub - One Website, Hundreds of Useful Tools</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8771215756914557" crossorigin="anonymous"></script>
  <meta name="google-site-verification" content="G4QkJDDggECQLsdqIRQ7hDwwu8uFtro8EwzE3wLZId8" />
  <meta name="description" content="Smart India Hub: Photo Resizer, Signature & Passport Maker, Bulk Image Host & Link Generator, PDF Tools, Calculators, Text Tools, Password & QR Generator in Hindi & English." />
  <meta property="og:title" content="Smart India Hub - One Website, Hundreds of Useful Tools" />
  <meta property="og:description" content="Fast, mobile-friendly online tools for image resizing, Cloudinary bulk image hosting, calculations, text utilities, and more." />
  <meta property="og:type" content="website" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="brand" href="#top" onclick="resetSearch()">
      <div class="brand-badge">SI</div>
      <div>
        <span class="brand-name">Smart India Hub</span>
        <span class="brand-tag" id="tagline"></span>
      </div>
    </a>
    <nav>
      <a href="#tools-area" id="navAllTools"></a>
      <a href="#info-pages" id="navBlog"></a>
      <a href="#info-pages" id="navAbout"></a>
      <a href="#info-pages" id="navPrivacy"></a>
      <button class="lang-btn" type="button" onclick="toggleLang()" id="langToggle"></button>
    </nav>
  </div>
</header>

<section class="hero" id="top">
  <h1 id="heroTitle"></h1>
  <p id="heroSub"></p>
  <div class="search-box">
    <input type="search" id="searchInput" oninput="filterTools()" />
    <button type="button" onclick="filterTools()" id="searchBtn"></button>
  </div>
</section>

<main class="container">
  <div class="ad-slot" id="adSlotTop"></div>

  <section id="workspace">
    <div class="ws-top">
      <h2 id="wsTitle" style="font-size:18px; color:var(--primary-dark);">Tool</h2>
      <button class="close-btn" type="button" onclick="closeWorkspace()" id="closeWsBtn"></button>
    </div>
    <div id="wsBody"></div>
  </section>

  <div id="tools-area"></div>

  <div class="ad-slot" id="adSlotMid"></div>

  <section id="info-pages" class="cat-section">
    <div class="cat-header">
      <h2 class="cat-title" id="infoHeading"></h2>
    </div>
    <div class="info-grid" id="infoGrid"></div>
  </section>
</main>

<footer>
  <div class="footer-wrap">
    <div>
      <strong>Smart India Hub</strong> — <span id="footerTag"></span>
    </div>
    <div class="footer-links" id="footerLinks"></div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
