
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi7 जैसा फंक्शनल इमेज टूल</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-hover: #0056b3;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #333333;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; box-sizing: border-box; }
    .container { max-width: 900px; margin: auto; }
    h1 { text-align: center; color: #111; }
    .tool-section { display: none; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
    .tool-section.active { display: block; }
    .nav-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .nav-btn { background: #6c757d; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input[type="file"], input[type="number"], select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    .action-btn { background-color: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
    .action-btn:hover { background-color: var(--primary-hover); }
    .output-area { margin-top: 25px; padding: 15px; background: #e9ecef; border-radius: 8px; word-break: break-all; display: none; text-align: center; }
    .output-area img { max-width: 100%; height: auto; margin-top: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pi7 जैसा फंक्शनल इमेज टूल</h1>

    <div class="nav-buttons">
      <button class="nav-btn active" onclick="showTool('resizer')">Image Resizer</button>
      <button class="nav-btn" onclick="showTool('converter')">Image Converter</button>
      <button class="nav-btn" onclick="showTool('pdf')">Image to PDF</button>
      <button class="nav-btn" onclick="showTool('border')">Add Border</button>
    </div>

    <!-- 1. Resizer Section -->
    <div id="resizer" class="tool-section active">
      <h2>Image Resizer & Compressor</h2>
      <div class="form-group">
        <label>Select Image:</label>
        <input type="file" id="rImg" accept="image/*">
      </div>
      <div class="form-group">
        <label>Target Width (px):</label>
        <input type="number" id="rW" value="800">
      </div>
      <div class="form-group">
        <label>Quality (0.1 - 1.0):</label>
        <input type="number" id="rQ" value="0.8" step="0.1" min="0.1" max="1.0">
      </div>
      <button class="action-btn" onclick="runResizer()">Process & Compress</button>
      <div id="rOut" class="output-area"></div>
    </div>

    <!-- 2. Converter Section -->
    <div id="converter" class="tool-section">
      <h2>Image Format Converter</h2>
      <div class="form-group">
        <label>Select Image:</label>
        <input type="file" id="cImg" accept="image/*">
      </div>
      <div class="form-group">
        <label>Target Format:</label>
        <select id="cFmt">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WEBP</option>
        </select>
      </div>
      <button class="action-btn" onclick="runConverter()">Convert Format</button>
      <div id="cOut" class="output-area"></div>
    </div>

    <!-- 3. Image to PDF Section -->
    <div id="pdf" class="tool-section">
      <h2>Image to PDF Converter</h2>
      <div class="form-group">
        <label>Select Images:</label>
        <input type="file" id="pImgs" accept="image/*" multiple>
      </div>
      <button class="action-btn" onclick="runPdfConverter()">Convert to PDF</button>
      <div id="pOut" class="output-area"></div>
    </div>

    <!-- 4. Add Border Section -->
    <div id="border" class="tool-section">
      <h2>Add Border to Image</h2>
      <div class="form-group">
        <label>Select Image:</label>
        <input type="file" id="bImg" accept="image/*">
      </div>
      <div class="form-group">
        <label>Border Thickness (px):</label>
        <input type="number" id="bThick" value="10">
      </div>
      <div class="form-group">
        <label>Border Color:</label>
        <input type="color" id="bColor" value="#000000">
      </div>
      <button class="action-btn" onclick="runBorderAdder()">Apply Border</button>
      <div id="bOut" class="output-area"></div>
    </div>
  </div>

    <script>
    function showTool(toolId) {
      document.querySelectorAll('.tool-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(toolId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function displayOutput(outputId, contentHtml) {
      const out = document.getElementById(outputId);
      out.style.display = 'block';
      out.innerHTML = contentHtml;
    }

    // 1. Resizer Logic
    function runResizer() {
      const file = document.getElementById('rImg').files[0];
      const width = document.getElementById('rW').value;
      const quality = parseFloat(document.getElementById('rQ').value);
      if (!file) return alert('कृपया इमेज चुनें');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const scale = width / img.width;
          canvas.width = width;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const sizeKB = (blob.size / 1024).toFixed(2);
            displayOutput('rOut', `<p>साइज: ${sizeKB} KB</p><a href="${url}" download="resized_${file.name}" class="action-btn" style="display:inline-block;">Download Image</a>`);
          }, 'image/jpeg', quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 2. Converter Logic
    function runConverter() {
      const file = document.getElementById('cImg').files[0];
      const format = document.getElementById('cFmt').value;
      if (!file) return alert('कृपया इमेज चुनें');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          const url = canvas.toDataURL(format);
          const ext = format.split('/')[1];
          displayOutput('cOut', `<a href="${url}" download="converted_${file.name.split('.')[0]}.${ext}" class="action-btn" style="display:inline-block;">Download ${ext.toUpperCase()}</a>`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 3. PDF Converter Logic
    async function runPdfConverter() {
      const files = document.getElementById('pImgs').files;
      if (files.length === 0) return alert('कृपया कम से कम एक इमेज चुनें');
      displayOutput('pOut', 'PDF बनाई जा रही है...');

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let images = [];

      for (let file of files) {
        let url = await new Promise(r => { let reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        let img = new Image(); img.src = url; await img.decode();
        images.push(img);
      }

      let maxW = Math.max(...images.map(i => i.width));
      let totalH = images.reduce((acc, i) => acc + i.height, 0);
      canvas.width = maxW;
      canvas.height = totalH;

      let curY = 0;
      for (let img of images) {
        ctx.drawImage(img, (maxW - img.width) / 2, curY);
        curY += img.height;
      }

      const pdfUrl = canvas.toDataURL('image/jpeg', 1.0);
      displayOutput('pOut', `<a href="${pdfUrl}" target="_blank" class="action-btn" style="display:inline-block;">ओपन / सेव PDF</a>`);
    }

    // 4. Border Adder Logic
    function runBorderAdder() {
      const file = document.getElementById('bImg').files[0];
      const thick = parseInt(document.getElementById('bThick').value);
      const color = document.getElementById('bColor').value;
      if (!file) return alert('कृपया इमेज चुनें');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width + (thick * 2);
          canvas.height = img.height + (thick * 2);
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = color;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, thick, thick);
          
          const url = canvas.toDataURL('image/jpeg', 0.95);
          displayOutput('bOut', `<img src="${url}"><br><br><a href="${url}" download="bordered_${file.name}" class="action-btn" style="display:inline-block;">Download Image</a>`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
